# Codemagic CI/CD — Mahjong (Next.js + Capacitor iOS) → TestFlight
#
# 目的: クラウドMac(Codemagic)で iOS をビルドし IPA を作成、TestFlight へ送る準備。
# 秘密情報(.p8 / Apple ID / パスワード / Issuer ID / Key ID / 証明書)は
# **このファイル・リポジトリ・ログに一切書かない**。署名/配信は Codemagic の
# 「App Store Connect integration」(UIで登録した API Key) に委譲する。
#
# この生成物の前提(重要):
# - Capacitor 8 は CocoaPods ではなく Swift Package Manager 構成。
#   → Podfile / App.xcworkspace は無く、ビルド対象は ios/App/App.xcodeproj の scheme "App"。
#   (一般的な手順の "App.xcworkspace / --workspace" は本プロジェクトには存在しないため --project を使用)
# - Web は Next.js の静的書き出し(out/)。`npx cap sync ios` が out/ を iOS に取り込む。
#
# ユーザーが Codemagic UI で事前にやること:
#  1) GitHub: kaeru07/mahjong を接続
#  2) Teams > Integrations で App Store Connect API Key(.p8) を登録し、
#     その「integration 名」を下の integrations.app_store_connect に一致させる
#  3) App Store Connect に Bundle ID com.kaeru07.mahjong のアプリを用意

workflows:
  ios-capacitor-test:
    name: iOS Capacitor Test
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      # ↓ Codemagic UI で登録した App Store Connect API Key integration の「名前」に置き換える。
      #    (この名前が一致しないと署名取得・TestFlight配信ができない)
      app_store_connect: ASC_API_KEY

    environment:
      node: latest
      xcode: latest
      # 本構成は SwiftPM のため CocoaPods は実際には使われない(Podfile無し→pod installは走らない)。
      # 要望により既定を指定(無害)。
      cocoapods: default
      vars:
        BUNDLE_ID: "com.kaeru07.mahjong"
        # SwiftPM 構成のため workspace ではなく xcodeproj を指定。
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"

    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install

      - name: Build Next.js static app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Set up code signing
        # App Store Connect integration(ASC_API_KEY) の API Key を使って署名ファイルを取得・適用する。
        # --create で未作成の Bundle ID / 配布証明書 / プロビジョニングプロファイルを自動作成(初回ビルド向け)。
        # use-profiles が取得したプロファイルを App.xcodeproj の署名設定へ適用し、自動署名→管理署名へ変換する。
        script: |
          set -e
          keychain initialize
          # App Store(配布)用の署名ファイルを取得。無ければ作成する。
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain add-certificates
          # 取得したプロファイルを Xcode プロジェクトへ適用(CODE_SIGN_STYLE=Manual 等を書き込む)
          xcode-project use-profiles
          # --- 切り分け用: プロファイルが取得・適用されたかを必ずログに出す ---
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "--- fetched provisioning profiles ---"
          ls -1 "$PROFILE_DIR" 2>/dev/null || true
          if [ -z "$(ls -A "$PROFILE_DIR" 2>/dev/null)" ]; then
            echo "ERROR: App Store 用プロビジョニングプロファイルを取得できませんでした。"
            echo "  archive が『requires a provisioning profile』で失敗する原因はこれです。"
            echo "  確認: (1) Codemagic の App Store Connect integration 名が 'ASC_API_KEY' で、有効な API Key(.p8) が登録済みか"
            echo "        (2) その API Key のロールが App Manager もしくは Admin か(--create に必要)"
            echo "        (3) Apple Developer で Bundle ID com.kaeru07.mahjong が使えるか / 配布証明書の上限(2)に達していないか"
            exit 1
          fi

      - name: Build IPA
        # SwiftPM 構成のため --project(xcodeproj) を指定。署名は use-profiles 適用済みの管理署名を使う。
        script: |
          set -e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/build/outputs/**/*.ipa

    publishing:
      app_store_connect:
        # integration 認証で TestFlight へアップロード(秘密情報はUI側に保持)。
        auth: integration
        # TestFlight まで(本番審査提出はしない)。
        submit_to_testflight: true
