# Codemagic CI/CD — Mahjong (Next.js + Capacitor iOS) → TestFlight
#
# 目的: クラウドMac(Codemagic)で iOS をビルドし IPA を作成、TestFlight へ送る準備。
# 秘密情報(.p8 / Apple ID / パスワード / Issuer ID / Key ID / 証明書)は
# **このファイル・リポジトリ・ログに一切書かない**。署名/配信は Codemagic の
# 「App Store Connect integration」(UIで登録した API Key) に委譲する。
#
# この生成物の前提(重要):
# - Capacitor 8 は CocoaPods ではなく Swift Package Manager 構成。
#   → Podfile / App.xcworkspace は無く、ビルド対象は ios/App/App.xcodeproj の scheme "App"。
#   (一般的な手順の "App.xcworkspace / --workspace" は本プロジェクトには存在しないため --project を使用)
# - Web は Next.js の静的書き出し(out/)。`npx cap sync ios` が out/ を iOS に取り込む。
#
# ユーザーが Codemagic UI で事前にやること:
#  1) GitHub: kaeru07/mahjong を接続
#  2) Teams > Integrations で App Store Connect API Key(.p8) を登録し、
#     その「integration 名」を下の integrations.app_store_connect に一致させる
#  3) App Store Connect に Bundle ID com.kaeru07.mahjong のアプリを用意

workflows:
  ios-capacitor-test:
    name: iOS Capacitor Test
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      # ↓ Codemagic UI で登録した App Store Connect API Key integration の「名前」に置き換える。
      #    (この名前が一致しないと署名取得・TestFlight配信ができない)
      app_store_connect: ASC_API_KEY

    environment:
      node: latest
      xcode: latest
      # 本構成は SwiftPM のため CocoaPods は実際には使われない(Podfile無し→pod installは走らない)。
      # 要望により既定を指定(無害)。
      cocoapods: default
      vars:
        BUNDLE_ID: "com.kaeru07.mahjong"
        APP_VERSION: "1.0"
        BUILD_NUMBER: "2"
        # SwiftPM 構成のため workspace ではなく xcodeproj を指定。
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      # 署名は Codemagic 上で作成済みの「Reference name」を明示参照する方式。
      # これにより、Apple Developer Portal の既存証明書(秘密鍵なし)を取りに行って
      # "Cannot save Signing Certificates without certificate private key" で失敗する流れを避ける。
      # ※ certificates / provisioning_profiles を使う場合、distribution_type / bundle_identifier は併用しない。
      ios_signing:
        certificates:
          - IOS_DISTRIBUTION_CERTIFICATE   # Codemagic で生成済みの秘密鍵付き Apple Distribution 証明書の Reference name
        provisioning_profiles:
          - IOS_APP_STORE_PROFILE          # Codemagic で Fetch/Create した App Store プロファイルの Reference name

    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install

      - name: Build Next.js static app
        script: |
          npm run build

      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios

      - name: Set iOS app version
        script: |
          set -e
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Set up code signing
        # environment.ios_signing の Reference name(IOS_DISTRIBUTION_CERTIFICATE / IOS_APP_STORE_PROFILE)を
        # Codemagic が自動でキーチェーンへ追加・プロファイル配置する(秘密鍵付き証明書を使用)。
        # fetch-signing-files は使わない(Apple Portal の既存証明書を秘密鍵なしで取りに行って失敗するため)。
        # ここでは取得済みプロファイルを Xcode プロジェクトへ適用するだけ。
        script: |
          set -e
          xcode-project use-profiles
          # 切り分け用: 適用対象のプロファイルをログに出す(失敗時の確認用)
          echo "--- provisioning profiles in keychain dir ---"
          ls -1 "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || echo "(none)"

      - name: Build IPA
        # SwiftPM 構成のため --project(xcodeproj) を指定。署名は use-profiles 適用済みの管理署名を使う。
        script: |
          set -e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/build/outputs/**/*.ipa

    publishing:
      app_store_connect:
        # integration 認証で TestFlight へアップロード(秘密情報はUI側に保持)。
        auth: integration
        # TestFlight まで(本番審査提出はしない)。
        submit_to_testflight: true
